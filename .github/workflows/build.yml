name: Build AUR Package (CM5 aarch64)

on:
  workflow_dispatch:
    inputs:
      pkg_name:
        description: 'Назва пакета з AUR (напр. mpvpaper, mpv-git, ffmpeg-v4l2-request-git)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 1. Завантаження офіційної Manjaro ARM (rootfs) та підготовка під CM5
        run: |
          sudo mkdir -p /mnt/manjaro
          curl -L -s "https://github.com/manjaro-arm/rootfs/releases/download/latest/Manjaro-ARM-aarch64-latest.tar.gz" | sudo tar -xz -C /mnt/manjaro
          
          # Монтуємо системні шини для роботи всередині системи (chroot)
          sudo mount --bind /proc /mnt/manjaro/proc
          sudo mount --bind /sys /mnt/manjaro/sys
          sudo mount --bind /dev /mnt/manjaro/dev
          sudo mount --bind /dev/pts /mnt/manjaro/dev/pts
          sudo cp -L /etc/resolv.conf /mnt/manjaro/etc/resolv.conf

          # Ініціалізуємо ключі, оновлюємо бази та налаштовуємо компілятор під Cortex-A76
          sudo chroot /mnt/manjaro /bin/bash -e << 'CHROOT_EOF'
          pacman-mirrors -f 5
          pacman-key --init
          pacman-key --populate archlinuxarm manjaro manjaro-arm
          pacman -Syu --noconfirm base-devel git sudo
          
          useradd -m -G wheel builder
          echo "%wheel ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          sed -i 's/^CFLAGS=.*/CFLAGS="-march=armv8.2-a -mtune=cortex-a76 -O2 -pipe -fno-plt"/' /etc/makepkg.conf
          sed -i 's/^CXXFLAGS=.*/CXXFLAGS="$CFLAGS"/' /etc/makepkg.conf
          sed -i 's/^#MAKEFLAGS=.*/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf
          CHROOT_EOF

      - name: 2. Завантаження та компіляція пакета з AUR
        run: |
          sudo chroot /mnt/manjaro su - builder -c "
            git clone https://aur.archlinux.org/${{ inputs.pkg_name }}.git /tmp/pkg
            cd /tmp/pkg
            makepkg -sA --noconfirm --nocheck
          "
          mkdir -p ${{ github.workspace }}/out
          sudo cp /mnt/manjaro/tmp/pkg/*.pkg.tar.* ${{ github.workspace }}/out/
          sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}/out/

      - name: 3. Збереження готового бінарника
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pkg_name }}-cm5-aarch64
          path: ${{ github.workspace }}/out/*.pkg.tar.*
          if-no-files-found: error
