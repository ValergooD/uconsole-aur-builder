name: Build AUR Package (CM5 aarch64)

on:
  workflow_dispatch:
    inputs:
      pkg_name:
        description: 'Назва пакета з AUR'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 1. Завантаження Arch Linux ARM та підготовка chroot
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y libarchive-tools curl git

          sudo mkdir -p /mnt/alarm
          curl -fL --retry 3 "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz" -o /tmp/rootfs.tar.gz
          sudo bsdtar -xpf /tmp/rootfs.tar.gz -C /mnt/alarm
          rm -f /tmp/rootfs.tar.gz

          sudo mount --bind /mnt/alarm /mnt/alarm
          sudo mount --bind /proc /mnt/alarm/proc
          sudo mount --bind /sys /mnt/alarm/sys
          sudo mount --bind /dev /mnt/alarm/dev
          sudo mount --bind /dev/pts /mnt/alarm/dev/pts
          sudo rm -f /mnt/alarm/etc/resolv.conf
          sudo cp -L /etc/resolv.conf /mnt/alarm/etc/resolv.conf

          sudo chroot /mnt/alarm /bin/bash -ex << 'CHROOT_EOF'
          sed -i 's/^CheckSpace/#CheckSpace/' /etc/pacman.conf
          sed -i 's/^SigLevel.*/SigLevel = Never/' /etc/pacman.conf

          pacman -Syu --noconfirm --overwrite '*' ca-certificates archlinuxarm-keyring base-devel git sudo perl

          id -u builder &>/dev/null || useradd -m -G wheel builder
          echo "Defaults !requiretty" > /etc/sudoers.d/builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

          CORES=$(nproc)
          cat << MAKEPKG_EOF >> /etc/makepkg.conf
          CFLAGS="-march=armv8.2-a -mtune=cortex-a76 -O2 -pipe -fno-plt"
          CXXFLAGS="-march=armv8.2-a -mtune=cortex-a76 -O2 -pipe -fno-plt"
          MAKEFLAGS="-j${CORES}"
          OPTIONS=(strip !docs !libtool !staticlibs emptydirs zipman purge !debug !lto)
          MAKEPKG_EOF
          CHROOT_EOF

      - name: 2. Завантаження та компіляція пакета з AUR
        run: |
          set -euxo pipefail

          sudo chroot /mnt/alarm /usr/bin/env PKG="${{ inputs.pkg_name }}" /bin/bash -ex << 'CHROOT_BUILD'
          rm -rf /tmp/pkg
          mkdir -p /tmp/pkg
          chown -R builder:builder /tmp/pkg

          # Якщо передано ffmpeg-rpi, перемикаємо на справжнє ім'я в AUR
          TARGET_PKG="$PKG"
          if [[ "$PKG" == "ffmpeg-rpi" ]]; then
            TARGET_PKG="ffmpeg-v4l2-request-git"
          fi

          setpriv --reuid=builder --regid=builder --init-groups git clone "https://aur.archlinux.org/${TARGET_PKG}.git" /tmp/pkg
          cd /tmp/pkg

          if [ ! -f PKGBUILD ]; then
            echo "Помилка: PKGBUILD не знайдено для ${TARGET_PKG}"
            exit 1
          fi

          DEPS=$(setpriv --reuid=builder --regid=builder --init-groups makepkg --printsrcinfo | awk '/^\t(make|check)?depends = / {print $3}' | sed -E 's/[<>=:]+.*//' | sort -u)
          for dep in $DEPS; do
            pacman -S --needed --noconfirm "$dep" || true
          done

          if [[ "$TARGET_PKG" == *ffmpeg* ]]; then
            pacman -Rdd --noconfirm vulkan-headers vulkan-icd-loader libplacebo shaderc texinfo || true
            rm -rf /usr/include/vulkan /usr/include/vk_video || true

            # Ставимо заглушки прямо в /usr/bin, щоб /bin/sh гарантовано їх бачив
            ln -sf /usr/bin/true /usr/bin/texi2html
            ln -sf /usr/bin/true /usr/bin/makeinfo

            cat << 'DUMMY_POD' > /usr/bin/pod2man
          #!/bin/sh
          mkdir -p doc
          touch doc/ffmpeg.1 doc/ffplay.1 doc/ffprobe.1 2>/dev/null || true
          for arg in "$@"; do
            case "$arg" in
              *.1) mkdir -p "$(dirname "$arg")" && touch "$arg" 2>/dev/null || true ;;
            esac
          done
          exit 0
          DUMMY_POD
            chmod +x /usr/bin/pod2man

            for flag in omx libsvtav1 libvpl amf nvenc nvdec cuvid ffnvcodec avisynth ladspa vulkan libplacebo libshaderc htmlpages manpages podpages txtpages doc; do
              sed -i "s/--enable-${flag}//g" PKGBUILD || true
            done

            # Вимикаємо htmlpages прямо в конфігураторі, якщо є --prefix=/usr
            sed -i 's|--prefix=/usr|--prefix=/usr --disable-htmlpages --disable-txtpages|g' PKGBUILD || true
          fi

          setpriv --reuid=builder --regid=builder --init-groups env HOME=/home/builder PATH="/usr/bin:/usr/bin/core_perl:$PATH" bash -ex -c '
            cd /tmp/pkg
            makepkg -dA --noconfirm --nocheck --skippgpcheck
          '
          CHROOT_BUILD

          mkdir -p ${{ github.workspace }}/out
          sudo cp /mnt/alarm/tmp/pkg/*.pkg.tar.* ${{ github.workspace }}/out/
          sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}/out/

      - name: 3. Збереження готового бінарника
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pkg_name }}-cm5-aarch64
          path: ${{ github.workspace }}/out/*.pkg.tar.*
          if-no-files-found: error
